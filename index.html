<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f7f8fa">
    <title>门店经营数据</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div>
            <div class="eyebrow">STORE REPORT</div>
            <h1>门店经营数据</h1>
        </div>
        <button id="refreshBtn" class="icon-btn" aria-label="刷新">↻</button>
    </header>

    <main class="content">
        <section id="page-home" class="page active">
            <div class="selector-card">
                <div class="selector-group">
                    <label>门店</label>
                    <select id="storeSelect"></select>
                </div>
                <div class="selector-group">
                    <label>月份</label>
                    <select id="monthSelect"></select>
                </div>
            </div>

            <div id="summaryCards" class="summary-grid"></div>

            <section class="card chart-card">
                <div class="card-title">
                    <div>
                        <h2>营业收入趋势</h2>
                        <p>近 6 个月</p>
                    </div>
                </div>
                <div id="revenueTrend" class="chart"></div>
            </section>

            <section class="card chart-card">
                <div class="card-title">
                    <div>
                        <h2>门店营业收入</h2>
                        <p id="storeCompareSubtitle">当月各门店对比</p>
                    </div>
                </div>
                <div id="storeCompare" class="chart"></div>
            </section>

            <section class="card chart-card">
                <div class="card-title">
                    <div>
                        <h2>经营收入构成</h2>
                        <p id="compositionSubtitle">当前门店当月数据</p>
                    </div>
                </div>
                <div id="composition" class="chart pie-chart"></div>
            </section>
        </section>

        <section id="page-history" class="page">
            <div class="page-heading">
                <h2>历史月结</h2>
                <p>查看各门店历史经营数据</p>
            </div>
            <div id="historyList" class="history-list"></div>
        </section>

        <section id="page-analysis" class="page">
            <div class="page-heading">
                <h2>经营分析</h2>
                <p id="analysisSubtitle">趋势与利润变化</p>
            </div>

            <section class="card chart-card">
                <div class="card-title">
                    <div>
                        <h2>净利润趋势</h2>
                        <p>近 6 个月</p>
                    </div>
                </div>
                <div id="profitTrend" class="chart"></div>
            </section>

            <section class="card chart-card">
                <div class="card-title">
                    <div>
                        <h2>毛利率趋势</h2>
                        <p>近 6 个月</p>
                    </div>
                </div>
                <div id="marginTrend" class="chart"></div>
            </section>

            <section id="analysisMetrics" class="analysis-metrics"></section>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" data-page="home">
            <span class="nav-icon">⌂</span>
            <span>首页</span>
        </button>
        <button class="nav-item" data-page="history">
            <span class="nav-icon">▤</span>
            <span>历史</span>
        </button>
        <button class="nav-item" data-page="analysis">
            <span class="nav-icon">⌁</span>
            <span>分析</span>
        </button>
    </nav>
</div>

<div id="toast" class="toast"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
